<main class="panel activo login-panel" aria-label="Pantalla de selección de usuario">

  <section class="login-cabecera">
    <p class="login-marca">FUVI</p>
    <h1>¿QUIÉN ERES?</h1>
  </section>

  @if (cargando()) {
    <p class="login-estado">CARGANDO...</p>
  }

  @if (!cargando()) {
    <section class="usuarios-grid" aria-label="Selecciona tu perfil">
      @for (usuario of usuariosAMostrar(); track usuario._id) {
        <button
          class="usuario-card"
          [class.placeholder]="!hayUsuarios()"
          [style.background-color]="usuario.color"
          [disabled]="seleccionando() || !hayUsuarios()"
          (click)="seleccionarUsuario(usuario)"
          [attr.aria-label]="hayUsuarios() ? 'Entrar como ' + usuario.nombre : 'Sin usuario'"
        >
          <img
            class="usuario-avatar"
            [src]="imagenAvatar(usuario.avatar)"
            [alt]="usuario.nombre"
          />
          <span class="usuario-nombre">{{ usuario.nombre }}</span>
        </button>
      }
    </section>

    @if (mensajeError()) {
      <p class="login-estado login-error" role="alert">{{ mensajeError() }}</p>
    }
  }

</main>
